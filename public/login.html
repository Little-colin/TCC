<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Login - Rivals Arena</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body data-p="login">
        <header class="nav"></header>
        <main class="login pattern">
            <form id="form-login">
                <h1>LOGIN</h1>
                <label>E-mail<input type="email" id="login-email" autocomplete="email" placeholder="seu@email.com" required></label>
                <label>Senha<input type="password" id="login-senha" autocomplete="current-password" placeholder="*************" required></label>
                <button type="submit" class="btn">Login</button>
                <a href="#">CRIAR CONTA</a>
            </form>
        </main>
        <footer class="foot"></footer>
        <script type="module" src="script.js"></script>
        <script type="module" src="auth.js"></script>
    </body>
</html>
