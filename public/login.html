<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Login - Rivals Arena</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body data-p="login">
        <header class="nav"></header>
        <main class="login pattern">
            <form id="form-login">
                <h1>LOGIN</h1>
                <label>E-mail<input type="email" id="email" autocomplete="email" placeholder="seu@email.com" required></label>
                <label>Senha<input type="password" id="senha" autocomplete="current-password" placeholder="*************" required></label>
                <p id="mensagem" aria-live="polite"></p>
                <button type="submit" class="btn">Login</button>
                <a href="criar-conta.html">CRIAR CONTA</a>
            </form>
        </main>
        <footer class="foot"></footer>
        <script src="js/script.js"></script>
        <script src="js/comum.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
